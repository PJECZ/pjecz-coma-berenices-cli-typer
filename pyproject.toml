[project]
name = "pjecz-coma-berenices-cli-typer"
version = "0.1.0"
description = "Interfaz de Linea de Comandos (CLI) para vocear audiencias"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.27.1",
]

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821"]
line-length = 128

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pytest>=9.1.1",
]
